# TEMPLATE -- deliberately NOT listed in kustomization.yaml.
#
# Applying this file as it stands would install a manage token that is printed
# in a public repository. Create the Secret from real values instead:
#
#   kubectl -n muninn create secret generic muninn-upstream \
#     --from-literal=HF_TOKEN="$YOUR_HUB_TOKEN" \
#     --from-literal=XHC_MANAGE_TOKEN="$(openssl rand -hex 32)"
#
# or copy this file OUT of the repository, fill it in, and manage it the way you
# manage every other credential (sealed-secrets, an external secrets operator,
# SOPS). Never commit the filled-in copy.
apiVersion: v1
kind: Secret
metadata:
  name: muninn-upstream
  namespace: muninn
type: Opaque
stringData:
  # The cache's own Hugging Face token. Model pods never see it: they
  # authenticate to Muninn with a Muninn key, and Muninn fetches from the Hub as
  # itself. Gated licences are accepted once, on this account. Every repository
  # this token can read is reachable through the cache by any key whose rules
  # cover it, so scope the token to what the cluster needs.
  HF_TOKEN: "REPLACE-with-a-read-only-hub-token"
  # THIS IS A KEY-MINTING CREDENTIAL. With XHC_AUTHZ_DB set (it is, in
  # statefulset.yaml), whoever holds it can create an administrator and mint
  # keys for any principal through /_cache/authz, besides prewarming, pinning
  # and deleting cached repos. Treat it like a root password: generate it
  # (`openssl rand -hex 32`), never put it in a manifest, an image, a command
  # line or a CI log, and rotate it by replacing this Secret and restarting the
  # pod. The prewarm Job is the only other thing in this example that mounts it.
  XHC_MANAGE_TOKEN: "REPLACE-with-openssl-rand-hex-32"
